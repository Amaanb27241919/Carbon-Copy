global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:3000']
    metrics_path: /metrics

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:3001']
    metrics_path: /metrics

  - job_name: 'data-server'
    static_configs:
      - targets: ['data-server:3002']
    metrics_path: /metrics

  - job_name: 'vm-manager'
    static_configs:
      - targets: ['vm-manager:3003']
    metrics_path: /metrics

  - job_name: 'openclaw'
    static_configs:
      - targets: ['openclaw:8001']
    metrics_path: /metrics

  - job_name: 'nemoclaw'
    static_configs:
      - targets: ['nemoclaw:8002']
    metrics_path: /metrics

  - job_name: 'model-router'
    static_configs:
      - targets: ['model-router:3004']
    metrics_path: /metrics
