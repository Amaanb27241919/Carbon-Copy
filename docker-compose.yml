version: "3.9"

networks:
  carbon-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  redis-data:
  prometheus-data:
  grafana-data:

x-node-common: &node-common
  restart: unless-stopped
  networks:
    - carbon-net
  env_file:
    - .env

services:
  # ─── Reverse Proxy ────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: carbon-nginx
    restart: unless-stopped
    networks:
      - carbon-net
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── API Gateway ──────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: carbon-gateway
    <<: *node-common
    expose:
      - "3000"
    environment:
      PORT: "3000"
      AUTH_SERVICE_URL: "http://auth:3001"
      OPENCLAW_SERVICE_URL: "http://openclaw:8001"
      NEMOCLAW_SERVICE_URL: "http://nemoclaw:8002"
      DATA_SERVER_URL: "http://data-server:3002"
      VM_MANAGER_URL: "http://vm-manager:3003"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Auth Service ─────────────────────────────────────────────────────────
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: carbon-auth
    <<: *node-common
    expose:
      - "3001"
    environment:
      PORT: "3001"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Data Server ──────────────────────────────────────────────────────────
  data-server:
    build:
      context: ./data-server
      dockerfile: Dockerfile
    container_name: carbon-data-server
    <<: *node-common
    expose:
      - "3002"
    environment:
      PORT: "3002"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── VM Manager ───────────────────────────────────────────────────────────
  vm-manager:
    build:
      context: ./vm-manager
      dockerfile: Dockerfile
    container_name: carbon-vm-manager
    <<: *node-common
    expose:
      - "3003"
    environment:
      PORT: "3003"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      DOCKER_SOCKET: "/var/run/docker.sock"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── OpenClaw (AI Code Intelligence) ─────────────────────────────────────
  openclaw:
    build:
      context: ./services/openclaw
      dockerfile: Dockerfile
    container_name: carbon-openclaw
    restart: unless-stopped
    networks:
      - carbon-net
    env_file:
      - .env
    expose:
      - "8001"
    environment:
      PORT: "8001"
      ENV: "production"
      DATA_SERVER_URL: "http://data-server:3002"
      LLM_API_BASE_URL: "${LLM_API_BASE_URL}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${OPENCLAW_LLM_MODEL}"
    depends_on:
      data-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── NemoClaw (AI NLP Intelligence) ──────────────────────────────────────
  nemoclaw:
    build:
      context: ./services/nemoclaw
      dockerfile: Dockerfile
    container_name: carbon-nemoclaw
    restart: unless-stopped
    networks:
      - carbon-net
    env_file:
      - .env
    expose:
      - "8002"
    environment:
      PORT: "8002"
      ENV: "production"
      DATA_SERVER_URL: "http://data-server:3002"
      LLM_API_BASE_URL: "${LLM_API_BASE_URL}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${NEMOCLAW_LLM_MODEL}"
      EMBEDDING_MODEL: "${NEMOCLAW_EMBEDDING_MODEL}"
    depends_on:
      data-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: carbon-postgres
    restart: unless-stopped
    networks:
      - carbon-net
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: carbon-redis
    restart: unless-stopped
    networks:
      - carbon-net
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── MinIO ────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: carbon-minio
    restart: unless-stopped
    networks:
      - carbon-net
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: carbon-prometheus
    restart: unless-stopped
    networks:
      - carbon-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: carbon-grafana
    restart: unless-stopped
    networks:
      - carbon-net
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    expose:
      - "3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
