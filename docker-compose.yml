version: "3.9"

networks:
  carbon-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  redis-data:
  prometheus-data:
  grafana-data:
  ollama-models:
  sandbox-tmp:
  vm-images:
  # Homelab storage volumes
  immich-data:
  immich-model-cache:
  syncthing-data:
  syncthing-config:
  uptime-kuma-data:
  pihole-data:
  pihole-dnsmasq:

x-node-common: &node-common
  restart: unless-stopped
  networks:
    - carbon-net
  env_file:
    - .env

services:
  # ─── Docker Socket Proxy (security: restricts API surface) ───────────────
  # vm-manager and sandbox connect to this instead of the raw Docker socket.
  # Only the specific API endpoints each service needs are permitted.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: carbon-docker-proxy
    restart: unless-stopped
    networks:
      - carbon-net
    environment:
      # Allow only what vm-manager + sandbox need
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 0
      VOLUMES: 0
      POST: 1       # allow start/stop/restart
      DELETE: 1     # allow container removal (sandbox cleanup)
      BUILD: 0      # builds go through Dockerode directly
      EXEC: 0
      SWARM: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      NODES: 0
      PLUGINS: 0
      SYSTEM: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true   # required for the proxy itself to read the socket
  # ─── Reverse Proxy ────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: carbon-nginx
    restart: unless-stopped
    networks:
      - carbon-net
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── API Gateway ──────────────────────────────────────────────────────────
  # Proxy routes: /api/openclaw, /api/nemoclaw, /api/data, /api/vm, /api/models/*, /api/chat
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: carbon-gateway
    <<: *node-common
    expose:
      - "3000"
    environment:
      PORT: "3000"
      AUTH_SERVICE_URL: "http://auth:3001"
      OPENCLAW_SERVICE_URL: "http://openclaw:8001"
      NEMOCLAW_SERVICE_URL: "http://nemoclaw:8002"
      DATA_SERVER_URL: "http://data-server:3002"
      VM_MANAGER_URL: "http://vm-manager:3003"
      MODEL_ROUTER_URL: "http://model-router:3004"
      SANDBOX_SERVICE_URL: "http://sandbox:3005"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Auth Service ─────────────────────────────────────────────────────────
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: carbon-auth
    <<: *node-common
    expose:
      - "3001"
    environment:
      PORT: "3001"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Data Server ──────────────────────────────────────────────────────────
  data-server:
    build:
      context: ./data-server
      dockerfile: Dockerfile
    container_name: carbon-data-server
    <<: *node-common
    expose:
      - "3002"
    environment:
      PORT: "3002"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── VM Manager ───────────────────────────────────────────────────────────
  vm-manager:
    build:
      context: ./vm-manager
      dockerfile: Dockerfile
    container_name: carbon-vm-manager
    <<: *node-common
    expose:
      - "3003"
    environment:
      PORT: "3003"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      DOCKER_SOCKET: "tcp://docker-proxy:2375"
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Ollama (Local LLM Inference) ────────────────────────────────────────
  ollama:
    build: ./services/ollama
    container_name: carbon-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_PRELOAD_MODELS=${OLLAMA_PRELOAD_MODELS:-}
    networks:
      - carbon-net
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Model Router (Universal AI Provider Router) ──────────────────────────
  model-router:
    build: ./model-router
    container_name: carbon-model-router
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-llama3.2}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL:-gpt-4o}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_DEFAULT_MODEL=${ANTHROPIC_DEFAULT_MODEL:-claude-sonnet-4-6}
      - HF_API_KEY=${HF_API_KEY:-}
      - HF_DEFAULT_MODEL=${HF_DEFAULT_MODEL:-mistralai/Mistral-7B-Instruct-v0.3}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      - ollama
      - postgres
    networks:
      - carbon-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── OpenClaw (AI Code Intelligence) ─────────────────────────────────────
  openclaw:
    build:
      context: ./services/openclaw
      dockerfile: Dockerfile
    container_name: carbon-openclaw
    restart: unless-stopped
    networks:
      - carbon-net
    env_file:
      - .env
    expose:
      - "8001"
    environment:
      PORT: "8001"
      ENV: "production"
      DATA_SERVER_URL: "http://data-server:3002"
      LLM_API_BASE_URL: "${LLM_API_BASE_URL}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${OPENCLAW_LLM_MODEL}"
    depends_on:
      data-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── NemoClaw (AI NLP Intelligence) ──────────────────────────────────────
  nemoclaw:
    build:
      context: ./services/nemoclaw
      dockerfile: Dockerfile
    container_name: carbon-nemoclaw
    restart: unless-stopped
    networks:
      - carbon-net
    env_file:
      - .env
    expose:
      - "8002"
    environment:
      PORT: "8002"
      ENV: "production"
      DATA_SERVER_URL: "http://data-server:3002"
      LLM_API_BASE_URL: "${LLM_API_BASE_URL}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${NEMOCLAW_LLM_MODEL}"
      EMBEDDING_MODEL: "${NEMOCLAW_EMBEDDING_MODEL}"
    depends_on:
      data-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: carbon-postgres
    restart: unless-stopped
    networks:
      - carbon-net
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: carbon-redis
    restart: unless-stopped
    networks:
      - carbon-net
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── MinIO ────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: carbon-minio
    restart: unless-stopped
    networks:
      - carbon-net
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: carbon-prometheus
    restart: unless-stopped
    networks:
      - carbon-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: carbon-grafana
    restart: unless-stopped
    networks:
      - carbon-net
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    expose:
      - "3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Sandbox Runner ───────────────────────────────────────────────────────
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: carbon-sandbox
    <<: *node-common
    expose:
      - "3005"
    environment:
      PORT: "3005"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      DOCKER_SOCKET: "tcp://docker-proxy:2375"
      SANDBOX_TMP_DIR: "/tmp/sandbox"
      SANDBOX_CPU_LIMIT: "${SANDBOX_CPU_LIMIT:-2}"
      SANDBOX_MEMORY_MB: "${SANDBOX_MEMORY_MB:-2048}"
      SANDBOX_TIMEOUT_MINUTES: "${SANDBOX_TIMEOUT_MINUTES:-30}"
    volumes:
      - sandbox-tmp:/tmp/sandbox
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Web App (iPhone/iPad PWA) ─────────────────────────────────────────────
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: carbon-web-app
    <<: *node-common
    expose:
      - "3006"
    environment:
      PORT: "3006"
      NEXT_PUBLIC_API_URL: "/api"
      NEXT_PUBLIC_APP_NAME: "Carbon Cloud"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # HOMELAB + STORAGE SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── Tailscale VPN ────────────────────────────────────────────────────────
  # Secure remote access from iPhone/iPad anywhere — no port forwarding needed
  tailscale:
    image: tailscale/tailscale:latest
    container_name: carbon-tailscale
    restart: unless-stopped
    network_mode: host           # must be host to manage the host's network
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TS_AUTHKEY: "${TAILSCALE_AUTH_KEY:-}"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_HOSTNAME: "${TAILSCALE_HOSTNAME:-carbon-copy}"
      TS_EXTRA_ARGS: "--advertise-exit-node"
    volumes:
      - /var/lib/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    profiles:
      - homelab

  # ─── DuckDNS (Dynamic DNS) ────────────────────────────────────────────────
  # Keeps yourdomain.duckdns.org pointing to your home IP even when it changes
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: carbon-duckdns
    restart: unless-stopped
    networks:
      - carbon-net
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-UTC}"
      SUBDOMAINS: "${DUCKDNS_SUBDOMAIN:-}"
      TOKEN: "${DUCKDNS_TOKEN:-}"
      LOG_FILE: "false"
    profiles:
      - homelab

  # ─── Uptime Kuma (Service Status Dashboard) ───────────────────────────────
  # Simple, beautiful uptime monitor — better than Grafana for at-a-glance status
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: carbon-uptime-kuma
    restart: unless-stopped
    networks:
      - carbon-net
    volumes:
      - uptime-kuma-data:/app/data
    expose:
      - "3001"
    ports:
      - "3001:3001"              # also expose directly for easy access
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - homelab

  # ─── Pi-hole (DNS + Ad Blocking) ──────────────────────────────────────────
  pihole:
    image: pihole/pihole:latest
    container_name: carbon-pihole
    restart: unless-stopped
    networks:
      - carbon-net
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80"                # admin UI on port 8053
    environment:
      TZ: "${TZ:-UTC}"
      WEBPASSWORD: "${PIHOLE_PASSWORD:-changeme}"
      PIHOLE_DNS_: "8.8.8.8;8.8.4.4"
      DNSSEC: "true"
    volumes:
      - pihole-data:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d
    profiles:
      - homelab

  # ─── Immich (iPhone Photo Backup) ─────────────────────────────────────────
  # Self-hosted Google Photos alternative — backs up iPhone photos automatically
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: carbon-immich-server
    restart: unless-stopped
    networks:
      - carbon-net
    ports:
      - "2283:3001"              # Immich web UI
    environment:
      DB_HOSTNAME: postgres
      DB_PORT: "5432"
      DB_DATABASE_NAME: immich
      DB_USERNAME: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      REDIS_HOSTNAME: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      UPLOAD_LOCATION: /usr/src/app/upload
      IMMICH_VERSION: release
    volumes:
      - immich-data:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/server-info/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - homelab

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: carbon-immich-ml
    restart: unless-stopped
    networks:
      - carbon-net
    volumes:
      - immich-model-cache:/cache
    environment:
      IMMICH_VERSION: release
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3003/ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - homelab

  # ─── Samba (Network File Shares) ──────────────────────────────────────────
  # Access files from iPhone Files app, Windows Explorer, macOS Finder
  samba:
    image: dperson/samba:latest
    container_name: carbon-samba
    restart: unless-stopped
    network_mode: host           # SMB requires host networking for discovery
    environment:
      TZ: "${TZ:-UTC}"
      USERID: "1000"
      GROUPID: "1000"
    volumes:
      - ./storage/shared:/mount/shared
      - ./storage/ai-outputs:/mount/ai-outputs
      - immich-data:/mount/photos
    command: >
      -u "carbon;${SAMBA_PASSWORD:-changeme}"
      -s "shared;/mount/shared;yes;no;no;carbon"
      -s "ai-outputs;/mount/ai-outputs;yes;no;yes;carbon"
      -s "photos;/mount/photos;yes;no;yes;carbon"
      -p
    profiles:
      - homelab

  # ─── Syncthing (Continuous File Sync) ────────────────────────────────────
  # Sync files between your devices automatically — like Dropbox but self-hosted
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: carbon-syncthing
    restart: unless-stopped
    networks:
      - carbon-net
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-UTC}"
    volumes:
      - syncthing-config:/config
      - syncthing-data:/data
      - ./storage/shared:/data/shared
    ports:
      - "8384:8384"              # Syncthing web UI
      - "22000:22000/tcp"        # Syncthing sync port
      - "22000:22000/udp"
      - "21027:21027/udp"        # Syncthing discovery
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8384"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - homelab

  # ─── VS Code Dev Environment ───────────────────────────────────────────────
  code-server:
    image: codercom/code-server:latest
    container_name: carbon-code-server
    restart: unless-stopped
    networks:
      - carbon-net
    environment:
      PASSWORD: "${CODE_SERVER_PASSWORD:-changeme}"
    volumes:
      - ./:/home/coder/carbon-copy
      - sandbox-tmp:/home/coder/sandbox
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── KVM Manager (QEMU/KVM Virtual Machines) ──────────────────────────────
  kvm-manager:
    build:
      context: ./kvm-manager
      dockerfile: Dockerfile
    container_name: carbon-kvm-manager
    restart: unless-stopped
    networks:
      - carbon-net
    env_file:
      - .env
    expose:
      - "3007"
    ports:
      # SSH ports for VMs (VM0=2200, VM1=2201, ... VM9=2209)
      - "2200-2209:2200-2209"
      # VNC ports for VMs — accessed via noVNC proxy
      - "5900-5909:5900-5909"
    environment:
      PORT: "3007"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN}"
      VM_IMAGES_DIR: "/var/lib/carbon-vms"
      VM_SSH_PORT_START: "2200"
      VM_VNC_PORT_START: "5900"
      VM_MAX_COUNT: "${VM_MAX_COUNT:-10}"
      HOST_IP: "${HOST_IP:-localhost}"
    devices:
      # KVM acceleration — only works on Linux hosts with hardware virtualisation
      # Remove this block on macOS/Windows (falls back to software emulation)
      - /dev/kvm:/dev/kvm
    volumes:
      - vm-images:/var/lib/carbon-vms
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3007/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── noVNC (browser-based VM console) ────────────────────────────────────
  novnc:
    image: theasp/novnc:latest
    container_name: carbon-novnc
    restart: unless-stopped
    networks:
      - carbon-net
    environment:
      DISPLAY_WIDTH: "1280"
      DISPLAY_HEIGHT: "800"
      # noVNC proxies to kvm-manager host on the VNC port
      VNC_SERVER: "kvm-manager"
    expose:
      - "8080"
