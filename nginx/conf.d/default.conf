server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS resolver to resolve upstream names dynamically
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 100M;

    # ── iPhone/iPad PWA ─────────────────────────────────────────────────────
    location /app {
        proxy_pass         http://web-app:3006;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # ── VS Code (code-server) ────────────────────────────────────────────────
    location /code {
        return 503;  # code-server unavailable on ARM Mac
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
    }

    # ── Uptime Kuma (service status) ─────────────────────────────────────────
    location /status {
        return 503;  # uptime-kuma requires homelab profile
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # ── Immich (photo backup) ────────────────────────────────────────────────
    location /photos {
        return 503;  # immich-server requires homelab profile
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 600s;        # large uploads need long timeout
        client_max_body_size 4G;        # allow large video uploads
    }

    # ── Pi-hole admin (DNS dashboard) ────────────────────────────────────────
    location /dns {
        return 503;  # pihole requires homelab profile
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Syncthing UI ─────────────────────────────────────────────────────────
    location /sync {
        return 503;  # syncthing requires homelab profile
        proxy_http_version 1.1;
        proxy_set_header   Host              localhost;  # syncthing checks Host header
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── VM Console (noVNC browser-based KVM terminal) ───────────────────────
    location /console {
        proxy_pass         http://novnc:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
    }

    # ── ARIA Socket.IO (real-time mission/agent updates) ─────────────────────
    location /socket.io {
        proxy_pass         http://aria-service:3008;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400s;
    }

    # ── API Gateway (everything else) ────────────────────────────────────────
    location / {
        proxy_pass         http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    300s;
    }
}
